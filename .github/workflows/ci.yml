# Pipeline de Integração Contínua do TaskAnalyzer (Fase 3).
# Executa o Test Harness a cada push ou Pull Request nas branches main e develop.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test Harness (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Test Harness
        run: pytest tests/test_harness.py -v

  docker:
    name: Test Harness no container (Docker)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker compose build

      - name: Executar Test Harness no container
        run: docker compose run --rm tests
